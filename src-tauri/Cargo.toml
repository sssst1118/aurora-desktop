[package]
name = "aurora-desktop"
version = "0.1.0"
description = "Aurora 桌面启动器(灵动岛 + 全局搜索)"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aurora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset:2.4 壁纸预览的 assetProtocol 静态注册需要
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
opener = "0.7"
# 2.1/2.4 图标提取与窗口操作:Win32_UI_Shell(ExtractIconExW/IShellLinkW)、Win32_System_Com(COM)
# 2.5 网络采样:Win32_NetworkManagement_IpHelper(GetIfTable2)
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_NetworkManagement_IpHelper"] }
png = "0.17"
known-folders = "1.4"
notify = "6"
tauri-plugin-clipboard = "2"
