[package]
name = "aurora-desktop"
version = "0.1.1"
description = "Aurora 桌面启动器(灵动岛 + 全局搜索)"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aurora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset:2.4 壁纸预览的 assetProtocol 静态注册需要
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
opener = "0.7"
# 2.1/2.4 图标提取与窗口操作:Win32_UI_Shell(ExtractIconExW/IShellLinkW)、Win32_System_Com(COM)
# 2.5 网络采样:Win32_NetworkManagement_IpHelper(GetIfTable2)
# Phase4 4.1 电池降载:Win32_System_Power(GetSystemPowerStatus);4.3 UIA:Win32_UI_Accessibility(Uia* 函数族)+ Win32_System_Variant(UiaGetPropertyValue 的 VARIANT 参数)
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_NetworkManagement_IpHelper", "Win32_System_Power", "Win32_UI_Accessibility", "Win32_System_Variant"] }
png = "0.17"
known-folders = "1.4"
notify = "6"
tauri-plugin-clipboard = "2"
# ---- Phase3 AI 代理(设计文档 §1.6):OpenAI 兼容 HTTP 客户端;Windows 上 native-tls=schannel(系统证书库),无需 OpenSSL;json=请求/响应序列化,stream=SSE bytes_stream ----
reqwest = { version = "0.12", features = ["json", "stream"] }
# SSE 逐行解析用 StreamExt(3.1 实现时可选手写缓冲读取,二选一)
futures-util = "0.3"
# 5.1 自动更新:下载产物 SHA-256 校验(自研 updater,不引需签名的官方插件)
sha2 = "0.10"
# SSE idle 超时(30s 无增量视为断线)用 tokio::time::timeout;tauri 依赖树已含 tokio,这里显式声明以免 3.1 模块编译报未声明依赖
# H3 安全加固:危险工具确认等待用 tokio::sync::oneshot(需 sync feature)
tokio = { version = "1", features = ["time", "sync"] }
image = "0.25.10"
base64 = "0.23.1"
